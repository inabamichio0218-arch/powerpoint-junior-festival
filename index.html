<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10182d">
<title>中学部 社会科展示 | 文化祭</title>
<style>
:root{color-scheme:dark;--bg:#0c1326;--ink:#f5f8ff;--muted:#bbc9df;--border:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(circle at 50% -25%,#314677 0%,#111c36 42%,#090e1b 100%)}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #fff;outline-offset:3px}
.shell{width:min(1800px,100%);min-height:100dvh;margin:auto;padding:clamp(12px,2.4vh,26px) clamp(12px,2vw,30px) clamp(16px,3vh,30px);display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.top{text-align:center;flex:none}.eyebrow{color:#bbcbf0;letter-spacing:.26em;font-weight:800;font-size:clamp(11px,1vw,16px)}.top h1{margin:.15em 0 0;font-size:clamp(23px,2.8vw,48px);line-height:1.2;font-weight:900;letter-spacing:.06em;text-shadow:0 4px 20px #0007}.top p{margin:.5em 0 0;color:#d3ddf0;font-weight:700;font-size:clamp(12px,1.1vw,19px)}
.columns{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.5vw,22px);min-height:0}
.panel{display:flex;flex-direction:column;min-width:0;overflow:hidden;border-radius:clamp(14px,1.5vw,24px);border:1px solid var(--border);background:#15223a;box-shadow:0 15px 45px #0005;position:relative}
.panel:before{content:"";height:6px;background:var(--accent);position:absolute;inset:0 0 auto;z-index:2}
.hero{height:clamp(145px,24vh,280px);position:relative;display:flex;align-items:flex-end;overflow:hidden;background:var(--fallback);isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center;transform:scale(1.015);z-index:-2}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 18%,rgba(5,12,30,.46) 49%,rgba(5,10,23,.96) 100%);z-index:-1}
.panel.culture .hero:before{background:radial-gradient(ellipse at 25% 28%,#e5b06670,transparent 38%), radial-gradient(ellipse at 80% 18%,#68adcb65,transparent 44%),linear-gradient(140deg,#714e47,#204e69 55%,#333655)}
.museum-scene{position:absolute;inset:10px 0 45px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.3vw,22px);filter:drop-shadow(0 8px 12px #0007);font-size:clamp(38px,5vw,82px)}
.hero-label{width:100%;padding:15px clamp(14px,1.6vw,28px) 14px}.kicker{font-size:clamp(10px,.82vw,14px);font-weight:800;letter-spacing:.12em;color:#e1ebfa}.hero h2{font-size:clamp(23px,2vw,38px);line-height:1.18;margin:5px 0 0;letter-spacing:.02em;text-shadow:0 3px 12px #000b}
.description{padding:clamp(10px,1.1vw,18px) clamp(14px,1.5vw,24px) 5px;font-size:clamp(12px,1vw,17px);font-weight:700;color:#d9e4fa;min-height:clamp(39px,5.2vh,63px);line-height:1.45}
.student-list{display:grid;grid-template-columns:1fr;gap:clamp(7px,1.1vh,13px);padding:clamp(8px,.8vw,14px) clamp(12px,1.3vw,22px) clamp(14px,1.6vw,28px);flex:1;align-content:center}
.student{display:flex;align-items:center;justify-content:space-between;min-height:clamp(43px,7.2vh,74px);width:100%;padding:8px clamp(12px,1.3vw,22px);border-radius:12px;background:linear-gradient(100deg,rgba(255,255,255,.13),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);color:white;font-size:clamp(19px,1.75vw,30px);font-weight:900;transition:background .15s,transform .15s}
.student:hover{background:color-mix(in srgb,var(--accent) 28%,#16253c);transform:translateY(-2px)}.student .arrow{font-size:.8em;color:var(--accent);background:#0715278c;width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%}
.footer{text-align:center;color:#b9c9df;font-size:clamp(11px,.9vw,15px);font-weight:700}
.viewer[hidden]{display:none!important}.viewer{position:fixed;inset:0;z-index:100;background:#050912;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.viewbar{flex:none;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px clamp(12px,2vw,30px);background:#142039;border-bottom:1px solid #53617c;color:#fff}
.viewtitle{font-size:clamp(18px,1.7vw,27px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewactions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.action{display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid #a8b9d6;background:#293b5c;color:#fff;text-decoration:none;font-size:clamp(14px,1.2vw,20px);font-weight:900;padding:10px 14px;white-space:nowrap}
.action.back{background:#dc467e;border-color:#f5a6c3}.action:hover{filter:brightness(1.17)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#080c16}.stage iframe{height:100%;width:100%;border:0;background:#fff}.stage video{display:block;max-height:100%;max-width:100%;width:100%;height:100%;object-fit:contain;background:#000}
@media(max-width:800px){.shell{min-height:100dvh}.columns{grid-template-columns:1fr}.hero{height:155px}.student-list{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:12px}.student{font-size:clamp(15px,2.5vw,22px);justify-content:center;min-height:55px;padding:6px}.student .arrow{display:none}.description{min-height:0}.viewbar{min-height:58px}.action{padding:9px}.viewtitle{font-size:16px}}
@media(max-width:520px){.student-list{grid-template-columns:repeat(3,minmax(0,1fr))}.action.open-file{display:none}.viewtitle{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

/* 文化祭の展示タイトル：ネオンと金色の光を重ねた華やかな演出 */
.top{position:relative;padding:clamp(5px,.9vh,10px) 0 clamp(8px,1.5vh,17px);isolation:isolate}
.top::before{content:"";position:absolute;z-index:-1;left:50%;top:42%;transform:translate(-50%,-50%);width:min(850px,90%);height:110%;background:radial-gradient(ellipse at center,rgba(69,111,237,.31),rgba(117,59,213,.12) 45%,transparent 72%);pointer-events:none}
.top .eyebrow{color:#9bdaff;text-shadow:0 0 16px rgba(78,171,255,.9);letter-spacing:.32em}
.top h1{display:inline-block;position:relative;margin:.14em 0 .06em;padding:0 .5em .08em;font-size:clamp(31px,3.65vw,66px);font-weight:1000;line-height:1.2;letter-spacing:.075em;color:#fff1b4;background:linear-gradient(180deg,#fffbe7 2%,#ffeab1 26%,#ffba43 53%,#ffef96 74%,#fff7d8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #7b3a27) drop-shadow(0 6px 10px #0009) drop-shadow(0 0 15px #ffc34a66)}
.top h1::before,.top h1::after{position:absolute;top:48%;font-size:clamp(20px,2.5vw,40px);-webkit-text-fill-color:#ffe68e;filter:drop-shadow(0 0 10px #ffda5e);content:"✦"}
.top h1::before{left:-.55em}.top h1::after{right:-.55em}
.top p{font-size:clamp(12px,1.14vw,20px);color:#eaf4ff;text-shadow:0 0 10px #77b6ef55}
@media(max-width:520px){.top h1{font-size:clamp(24px,6vw,36px);padding:0 .4em}.top h1::before{left:-.4em}.top h1::after{right:-.4em}}
</style>
</head>

<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="作品ビューアー" hidden>
 <div class="viewbar"><div class="viewtitle" id="viewtitle"></div><div class="viewactions"><a class="action open-file" id="openfile" target="_blank" rel="noopener">別画面で開く ↗</a><button class="action back" id="back" type="button">← みんなの作品へ</button></div></div>
 <div class="stage" id="stage"></div>
</section>
<script>
'use strict';
const students=[{id:'u',name:'于'},{id:'ochi',name:'越智'},{id:'sumida',name:'住田'},{id:'tahara',name:'田原'},{id:'yamamoto',name:'山本'}];
const themes={history:{label:'いろいろなものの歴史',ext:()=>'.pdf'},culture:{label:'世界の文化',ext:id=>(id==='sumida'||id==='tahara')?'.mp4':'.pdf'},earth:{label:'Google EarthでGO!',ext:()=>'.mp4'}};
// GitHubにアップロードされた実際の名前に合わせています（住田さんの歴史のみ smida_history.pdf）。
const fileFor=(id,theme)=>theme==='history'&&id==='sumida'?'smida_history.pdf':id+'_'+theme+themes[theme].ext(id);
const viewer=document.querySelector('#viewer'),stage=document.querySelector('#stage'),heading=document.querySelector('#viewtitle'),openfile=document.querySelector('#openfile'),home=document.querySelector('#home');
let opener=null;
for(const [key,theme] of Object.entries(themes)){
 const list=document.getElementById(key+'-list');
 for(const person of students){const btn=document.createElement('button');btn.className='student';btn.type='button';btn.innerHTML='<span>'+person.name+'</span><span class="arrow" aria-hidden="true">▶</span>';btn.setAttribute('aria-label',theme.label+'：'+person.name+'さんの作品を見る');btn.addEventListener('click',()=>show(key,person,btn));list.appendChild(btn)}
}
function show(theme,person,button){
 opener=button;const file=fileFor(person.id,theme);const src=encodeURI(file);const video=file.toLowerCase().endsWith('.mp4');
 heading.textContent=themes[theme].label+'　｜　'+person.name;
 openfile.href=src;openfile.textContent=video?'動画を別画面で開く ↗':'PDFを別画面で開く ↗';
 stage.replaceChildren();
 if(video){const el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.preload='metadata';el.src=src;el.setAttribute('aria-label',person.name+'さんの動画');stage.append(el);el.play().catch(()=>{});}
 else{const el=document.createElement('iframe');el.src=src+'#toolbar=1&navpanes=0';el.title=person.name+'さんのPDF';stage.append(el)}
 viewer.hidden=false;home.setAttribute('aria-hidden','true');document.body.style.overflow='hidden';document.getElementById('back').focus();
}
function close(){if(viewer.hidden)return;stage.querySelector('video')?.pause();stage.replaceChildren();viewer.hidden=true;home.removeAttribute('aria-hidden');document.body.style.overflow='';opener?.focus()}
document.getElementById('back').addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>
