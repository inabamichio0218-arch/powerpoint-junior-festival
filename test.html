<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10182d">
<title>中学部 社会科展示 | 文化祭</title>
<style>
:root{color-scheme:dark;--bg:#0c1326;--ink:#f5f8ff;--muted:#bbc9df;--border:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(circle at 50% -25%,#314677 0%,#111c36 42%,#090e1b 100%)}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #fff;outline-offset:3px}
.shell{width:min(1800px,100%);min-height:100dvh;margin:auto;padding:clamp(12px,2.4vh,26px) clamp(12px,2vw,30px) clamp(16px,3vh,30px);display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.top{text-align:center;flex:none}.eyebrow{color:#bbcbf0;letter-spacing:.26em;font-weight:800;font-size:clamp(11px,1vw,16px)}.top h1{margin:.15em 0 0;font-size:clamp(23px,2.8vw,48px);line-height:1.2;font-weight:900;letter-spacing:.06em;text-shadow:0 4px 20px #0007}.top p{margin:.5em 0 0;color:#d3ddf0;font-weight:700;font-size:clamp(12px,1.1vw,19px)}
.columns{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.5vw,22px);min-height:0}
.panel{display:flex;flex-direction:column;min-width:0;overflow:hidden;border-radius:clamp(14px,1.5vw,24px);border:1px solid var(--border);background:#15223a;box-shadow:0 15px 45px #0005;position:relative}
.panel:before{content:"";height:6px;background:var(--accent);position:absolute;inset:0 0 auto;z-index:2}
.hero{height:clamp(145px,24vh,280px);position:relative;display:flex;align-items:flex-end;overflow:hidden;background:var(--fallback);isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center;transform:scale(1.015);z-index:-2}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 18%,rgba(5,12,30,.46) 49%,rgba(5,10,23,.96) 100%);z-index:-1}
.panel.culture .hero:before{background:radial-gradient(ellipse at 25% 28%,#e5b06670,transparent 38%), radial-gradient(ellipse at 80% 18%,#68adcb65,transparent 44%),linear-gradient(140deg,#714e47,#204e69 55%,#333655)}
.museum-scene{position:absolute;inset:10px 0 45px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.3vw,22px);filter:drop-shadow(0 8px 12px #0007);font-size:clamp(38px,5vw,82px)}
.hero-label{width:100%;padding:15px clamp(14px,1.6vw,28px) 14px}.kicker{font-size:clamp(10px,.82vw,14px);font-weight:800;letter-spacing:.12em;color:#e1ebfa}.hero h2{font-size:clamp(23px,2vw,38px);line-height:1.18;margin:5px 0 0;letter-spacing:.02em;text-shadow:0 3px 12px #000b}
.description{padding:clamp(10px,1.1vw,18px) clamp(14px,1.5vw,24px) 5px;font-size:clamp(12px,1vw,17px);font-weight:700;color:#d9e4fa;min-height:clamp(39px,5.2vh,63px);line-height:1.45}
.student-list{display:grid;grid-template-columns:1fr;gap:clamp(7px,1.1vh,13px);padding:clamp(8px,.8vw,14px) clamp(12px,1.3vw,22px) clamp(14px,1.6vw,28px);flex:1;align-content:center}
.student{display:flex;align-items:center;justify-content:space-between;min-height:clamp(43px,7.2vh,74px);width:100%;padding:8px clamp(12px,1.3vw,22px);border-radius:12px;background:linear-gradient(100deg,rgba(255,255,255,.13),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);color:white;font-size:clamp(19px,1.75vw,30px);font-weight:900;transition:background .15s,transform .15s}
.student:hover{background:color-mix(in srgb,var(--accent) 28%,#16253c);transform:translateY(-2px)}.student .arrow{font-size:.8em;color:var(--accent);background:#0715278c;width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%}
.footer{text-align:center;color:#b9c9df;font-size:clamp(11px,.9vw,15px);font-weight:700}
.viewer[hidden]{display:none!important}.viewer{position:fixed;inset:0;z-index:100;background:#050912;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.viewbar{flex:none;min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px clamp(12px,2vw,30px);background:#142039;border-bottom:1px solid #53617c;color:#fff}
.viewtitle{font-size:clamp(18px,1.7vw,27px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewactions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.action{display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid #a8b9d6;background:#293b5c;color:#fff;text-decoration:none;font-size:clamp(14px,1.2vw,20px);font-weight:900;padding:10px 14px;white-space:nowrap}
.action.back{background:#dc467e;border-color:#f5a6c3}.action:hover{filter:brightness(1.17)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#080c16}.stage iframe{height:100%;width:100%;border:0;background:#fff}.stage video{display:block;max-height:100%;max-width:100%;width:100%;height:100%;object-fit:contain;background:#000}
@media(max-width:800px){.shell{min-height:100dvh}.columns{grid-template-columns:1fr}.hero{height:155px}.student-list{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:12px}.student{font-size:clamp(15px,2.5vw,22px);justify-content:center;min-height:55px;padding:6px}.student .arrow{display:none}.description{min-height:0}.viewbar{min-height:58px}.action{padding:9px}.viewtitle{font-size:16px}}
@media(max-width:520px){.student-list{grid-template-columns:repeat(3,minmax(0,1fr))}.viewtitle{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

/* 文化祭の展示タイトル：ネオンと金色の光を重ねた華やかな演出 */
.top{position:relative;padding:clamp(5px,.9vh,10px) 0 clamp(8px,1.5vh,17px);isolation:isolate}
.top::before{content:"";position:absolute;z-index:-1;left:50%;top:42%;transform:translate(-50%,-50%);width:min(850px,90%);height:110%;background:radial-gradient(ellipse at center,rgba(69,111,237,.31),rgba(117,59,213,.12) 45%,transparent 72%);pointer-events:none}
.top .eyebrow{color:#9bdaff;text-shadow:0 0 16px rgba(78,171,255,.9);letter-spacing:.32em}
.top h1{display:inline-block;position:relative;margin:.14em 0 .06em;padding:0 .5em .08em;font-size:clamp(31px,3.65vw,66px);font-weight:1000;line-height:1.2;letter-spacing:.075em;color:#fff1b4;background:linear-gradient(180deg,#fffbe7 2%,#ffeab1 26%,#ffba43 53%,#ffef96 74%,#fff7d8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #7b3a27) drop-shadow(0 6px 10px #0009) drop-shadow(0 0 15px #ffc34a66)}
.top h1::before,.top h1::after{position:absolute;top:48%;font-size:clamp(20px,2.5vw,40px);-webkit-text-fill-color:#ffe68e;filter:drop-shadow(0 0 10px #ffda5e);content:"✦"}
.top h1::before{left:-.55em}.top h1::after{right:-.55em}
.top p{font-size:clamp(12px,1.14vw,20px);color:#eaf4ff;text-shadow:0 0 10px #77b6ef55}
@media(max-width:520px){.top h1{font-size:clamp(24px,6vw,36px);padding:0 .4em}.top h1::before{left:-.4em}.top h1::after{right:-.4em}}

/* 文化祭 展示メニュー・華やか版（作品ビューアーの操作は元のまま） */
:root{--bg:#091333;--border:rgba(255,255,255,.35)}
body{background:radial-gradient(ellipse at 50% -5%,#344ea6 0%,#142b67 28%,#0c1b46 58%,#070f2a 100%);background-attachment:fixed}
.shell{gap:clamp(10px,1.5vh,16px)}
.top{padding:2px 0 clamp(6px,1.5vh,14px)}
.top::before{width:min(1250px,95%);height:170%;background:radial-gradient(ellipse at center,#8161f455 0%,#358de83d 46%,transparent 75%)}
.top .eyebrow{font-weight:950;color:#c3f6ff;font-size:clamp(12px,1.1vw,19px);letter-spacing:.27em}
.top h1{font-family:"Arial Black","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:clamp(34px,4.5vw,83px);font-weight:1000;line-height:1.16;letter-spacing:.045em;margin:.12em 0 .01em;padding:.02em .42em .09em;background:linear-gradient(180deg,#fffde6 0%,#ffe698 28%,#ffb02c 55%,#fff2a4 82%,#ffe78d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #873b2a) drop-shadow(0 6px 14px #000b) drop-shadow(0 0 20px #ffe2699c)}
.top h1::before,.top h1::after{font-size:clamp(17px,2.8vw,47px)}
.columns{gap:clamp(12px,1.5vw,24px)}
.panel{border:3px solid var(--accent);border-radius:24px;background:linear-gradient(180deg,#243c74 0%,#142958 100%);box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 32%,#142451),0 17px 40px #0008,0 0 22px color-mix(in srgb,var(--accent) 33%,transparent)}
.panel:before{height:9px;background:linear-gradient(90deg,transparent,var(--accent),#fff,var(--accent),transparent);box-shadow:0 0 16px var(--accent)}
.panel.earth{--accent:#62d7ff!important}.panel.culture{--accent:#76f4b3!important}.panel.history{--accent:#ffcf68!important}
.hero{height:clamp(170px,27vh,320px);background:#215ca0}
.hero:before{background-image:var(--photo)!important;background-position:center 32%;background-size:cover;transform:none}
.panel.culture .hero:before{background-image:var(--photo)!important;background-position:center 35%}
.panel.history .hero:before{background-position:center 33%}
.hero:after{background:linear-gradient(180deg,rgba(3,10,38,.02) 0%,rgba(6,15,45,.07) 34%,rgba(3,9,30,.72) 68%,rgba(3,8,29,.95) 100%)}
.hero-label{padding:15px clamp(14px,1.5vw,25px) 16px;filter:drop-shadow(0 2px 3px #001026)}
.kicker{font-size:clamp(12px,1vw,18px);font-weight:1000;color:#fff3b8;text-shadow:0 2px 6px #000}
.hero h2{font-size:clamp(24px,2.2vw,42px);font-weight:1000;letter-spacing:0;line-height:1.2;text-shadow:0 3px 0 #062252,0 5px 12px #000,0 0 12px #000}
.panel.history .hero h2{font-size:clamp(22px,1.95vw,38px)}
.description{font-size:clamp(13px,1.04vw,19px);font-weight:900;color:#fff;min-height:clamp(45px,6vh,69px);text-shadow:0 1px 4px #0008;padding-top:clamp(12px,1.4vw,22px)}
.student-list{gap:clamp(7px,1.2vh,14px)}
.student{background:linear-gradient(110deg,#38558d,#254678);border:2px solid color-mix(in srgb,var(--accent) 52%,#fff);border-radius:15px;box-shadow:inset 0 1px 0 #ffffff50,0 3px 0 #091636;color:#fff;font-size:clamp(22px,2vw,35px);text-shadow:0 2px 6px #0008}
.student .arrow{background:var(--accent);color:#0a2552;box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent);font-size:.82em}
.student:hover{background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 35%,#29436e),#2e5086);transform:translateY(-2px)}
.footer{color:#dce8ff;font-size:clamp(11px,.96vw,17px)}
@media(max-width:800px){.top h1{font-size:clamp(27px,5.2vw,53px)}.hero{height:170px}.description{min-height:0}.student{font-size:clamp(16px,2.7vw,24px)}}
@media(max-width:520px){.top h1{font-size:clamp(25px,6vw,36px)}.top h1::before,.top h1::after{font-size:16px}.hero{height:165px}}

/* 全画面モニター向け：左右の空きを減らし、３テーマの間隔を広げる */
@media (min-width: 801px) {
  .shell {
    width: 100%;
    max-width: 2400px;
    padding-left: clamp(14px, 1.5vw, 30px);
    padding-right: clamp(14px, 1.5vw, 30px);
  }
  .columns {
    gap: clamp(20px, 2.2vw, 45px);
  }
}

/* 中学部・文化祭用モーション：展示機能に干渉しない、CSSだけの演出 */
#home{isolation:isolate}
#home .top .eyebrow{animation:festivalEyebrow 4.8s ease-in-out infinite}
#home .top h1{animation:festivalGold 5.5s ease-in-out infinite}
#home .top h1::before,#home .top h1::after{animation:festivalStar 3.3s ease-in-out infinite}
#home .top h1::after{animation-delay:-1.65s}
#home .panel{animation:festivalPanel 12s ease-in-out infinite;will-change:box-shadow}
#home .panel.earth{--festival-delay:0s;animation-delay:0s}
#home .panel.culture{--festival-delay:-4s;animation-delay:-4s}
#home .panel.history{--festival-delay:-8s;animation-delay:-8s}
#home .panel::before{background:linear-gradient(95deg,transparent 0%,var(--accent) 22%,#fff8d9 42%,var(--accent) 62%,transparent 100%);background-size:240% 100%;animation:festivalBorder 6s linear infinite}
#home .panel.culture::before{animation-delay:-2s}
#home .panel.history::before{animation-delay:-4s}
/* 画像は固定のまま微妙なズームと視点移動。文字とボタンは動かさない。 */
#home .hero::before{animation:festivalScene 13s ease-in-out infinite alternate;transform-origin:50% 50%}
#home .panel.culture .hero::before{animation-duration:16s;animation-delay:-4s}
#home .panel.history .hero::before{animation-duration:14s;animation-delay:-7s}
/* イラストの上を幅広の光の帯が通り抜ける */
#home .hero::after{
  background:
    linear-gradient(110deg,transparent 13%,rgba(255,255,255,0) 35%,rgba(214,246,255,.22) 48%,rgba(255,255,255,.12) 52%,transparent 65%),
    linear-gradient(180deg,rgba(3,10,38,.02) 0%,rgba(6,15,45,.07) 34%,rgba(3,9,30,.72) 68%,rgba(3,8,29,.95) 100%);
  background-size:240% 100%,100% 100%;
  background-position:180% 0,center;
  animation:festivalSweep 8s ease-in-out infinite;
}
#home .panel.culture .hero::after{animation-delay:-2.7s}
#home .panel.history .hero::after{animation-delay:-5.3s}
/* 説明文字・クリック領域に触れない星の光 */
#home .hero-label{position:relative;z-index:1}
#home .hero-label::after{
  content:"✦";position:absolute;right:8%;top:-34%;
  color:#fffbd0;font-size:clamp(14px,1.7vw,29px);
  text-shadow:0 0 6px #fff,0 0 16px #ffeb96,0 0 30px var(--accent);
  pointer-events:none;animation:festivalGlint 4.6s ease-in-out infinite;
}
#home .panel.culture .hero-label::after{animation-delay:-1.8s}
#home .panel.history .hero-label::after{animation-delay:-3.1s}
/* A〜Eの再生ボタン：位置を変えずに光る */
#home .student .arrow{
  animation:festivalPlay 5s ease-in-out infinite;
  animation-delay:calc((var(--festival-delay,0s)) + (var(--row-delay,0s)));
}
#home .student:nth-child(1){--row-delay:0s}
#home .student:nth-child(2){--row-delay:-1s}
#home .student:nth-child(3){--row-delay:-2s}
#home .student:nth-child(4){--row-delay:-3s}
#home .student:nth-child(5){--row-delay:-4s}
#home .student:hover .arrow,#home .student:focus-visible .arrow{
  animation:none;box-shadow:0 0 18px 4px var(--accent),0 0 42px 10px color-mix(in srgb,var(--accent) 55%,transparent);
  filter:brightness(1.35);
}
#home .student:active{filter:brightness(1.3)}
@keyframes festivalEyebrow{0%,100%{text-shadow:0 0 7px #73d8ff8c}50%{text-shadow:0 0 22px #8cdeff,0 0 42px #3c8fff}}
@keyframes festivalGold{0%,100%{filter:drop-shadow(0 4px 0 #873b2a) drop-shadow(0 6px 14px #000b) drop-shadow(0 0 15px #ffe26988)}
 50%{filter:drop-shadow(0 4px 0 #873b2a) drop-shadow(0 6px 14px #000b) drop-shadow(0 0 34px #ffdd8ee6)}}
@keyframes festivalStar{0%,100%{opacity:.5;transform:scale(.75) rotate(-18deg)}45%{opacity:1;transform:scale(1.28) rotate(24deg)}}
@keyframes festivalPanel{
  0%,21%,40%,100%{box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 32%,#142451),0 17px 40px #0008,0 0 22px color-mix(in srgb,var(--accent) 33%,transparent)}
  10%{box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 42%,#142451),0 17px 40px #0008,0 0 36px 10px color-mix(in srgb,var(--accent) 62%,transparent),0 0 75px 17px color-mix(in srgb,var(--accent) 27%,transparent)}
}
@keyframes festivalBorder{0%{background-position:180% 0}100%{background-position:-70% 0}}
@keyframes festivalScene{0%{transform:scale(1.015) translateX(-.4%)}100%{transform:scale(1.105) translateX(.5%)}}
@keyframes festivalSweep{0%,15%{background-position:180% 0,center}48%,100%{background-position:-105% 0,center}}
@keyframes festivalGlint{0%,100%{opacity:.3;transform:scale(.6) rotate(-20deg)}48%{opacity:1;transform:scale(1.35) rotate(24deg)}}
@keyframes festivalPlay{
  0%,15%,38%,100%{box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent);filter:brightness(1)}
  24%{box-shadow:0 0 17px 5px var(--accent),0 0 34px 10px color-mix(in srgb,var(--accent) 65%,transparent);filter:brightness(1.3)}
}
@media(prefers-reduced-motion:reduce){
  #home .top .eyebrow,#home .top h1,#home .top h1::before,#home .top h1::after,
  #home .panel,#home .panel::before,#home .hero::before,#home .hero::after,
  #home .hero-label::after,#home .student .arrow{animation:none!important}
}


/* PDF.js テスト版：Edge標準の青いPDFツールバーを使わない */
.pdf-ui{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 20%,#1c3055,#0c1426 72%);color:#fff}
.pdf-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,1.2vw,18px);padding:9px 14px;min-height:58px;width:100%;background:#182c4d;border-bottom:1px solid #6b8bad55}
.pdf-btn{border:1px solid #9bd4ff;background:#235589;color:#fff;border-radius:11px;padding:9px 17px;font-size:clamp(14px,1.1vw,20px);font-weight:900;cursor:pointer}
.pdf-btn:disabled{opacity:.32;cursor:default}
.pdf-count{font-size:clamp(16px,1.4vw,23px);font-weight:900;min-width:6.3em;text-align:center}
.pdf-work{flex:1;min-height:0;width:100%;overflow:auto;display:flex;align-items:safe center;justify-content:safe center;padding:clamp(8px,1vw,20px);overscroll-behavior:contain}
.pdf-paper{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 8px 36px #0009;max-width:none}
.pdf-paper canvas{display:block;max-width:none;background:white}
.pdf-message{margin:auto;text-align:center;display:grid;place-items:center;gap:15px;font-size:clamp(18px,1.7vw,27px);font-weight:900;color:#fff1bf;padding:20px}
.pdf-spinner{width:56px;height:56px;border:6px solid #ffffff3a;border-top-color:#ffe36d;border-right-color:#71dcff;border-radius:50%;animation:pdfSpin .85s linear infinite}
.pdf-error{color:#ffcaca;font-size:clamp(16px,1.2vw,22px);text-align:center;max-width:680px;line-height:1.5}
.pdf-error a{color:#b9e7ff}
@keyframes pdfSpin{to{transform:rotate(360deg)}}
@media(max-width:600px){.pdf-btn{padding:9px 11px}.pdf-controls{min-height:53px}.pdf-count{min-width:5.3em}}
@media(prefers-reduced-motion:reduce){.pdf-spinner{animation:none}}

</style>

<body>
<main class="shell" id="home">
<header class="top"><div class="eyebrow">SCHOOL FESTIVAL · STUDENT WORKS</div><h1>中学部　社会科展示</h1></header>

<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="作品ビューアー" hidden>
 <div class="viewbar"><div class="viewtitle" id="viewtitle"></div><div class="viewactions"><button class="action back" id="back" type="button">← みんなの作品へ</button></div></div>
 <div class="stage" id="stage"></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
const students=[{id:'u',name:'A'},{id:'ochi',name:'B'},{id:'sumida',name:'C'},{id:'tahara',name:'D'},{id:'yamamoto',name:'E'}];
const themes={history:{label:'いろいろなものの歴史',ext:()=>'.pdf'},culture:{label:'アジアの文化',ext:id=>(id==='sumida'||id==='tahara')?'.mp4':'.pdf'},earth:{label:'Google EarthでGO!',ext:()=>'.mp4'}};
// GitHubにアップロードされた実際の名前に合わせています（歴史作品1件のみ smida_history.pdf）。
const fileFor=(id,theme)=>theme==='history'&&id==='sumida'?'smida_history.pdf':id+'_'+theme+themes[theme].ext(id);
const viewer=document.querySelector('#viewer'),stage=document.querySelector('#stage'),heading=document.querySelector('#viewtitle'),home=document.querySelector('#home');
let opener=null;
for(const [key,theme] of Object.entries(themes)){
 const list=document.getElementById(key+'-list');
 for(const person of students){const btn=document.createElement('button');btn.className='student';btn.type='button';btn.innerHTML='<span>'+person.name+'</span><span class="arrow" aria-hidden="true">▶</span>';btn.setAttribute('aria-label',theme.label+'：'+person.name+'さんの作品を見る');btn.addEventListener('click',()=>show(key,person,btn));list.appendChild(btn)}
}
let pdfSession=0,pdfTask=null,pdfRenderTask=null;
function pdfCleanup(){
 pdfSession++;
 try{pdfRenderTask?.cancel()}catch(e){}
 pdfRenderTask=null;
 if(pdfTask){try{pdfTask.destroy()}catch(e){}}
 pdfTask=null;
}
function show(theme,person,button){
 opener=button;const file=fileFor(person.id,theme);const src=encodeURI(file);const video=file.toLowerCase().endsWith('.mp4');
 heading.textContent=themes[theme].label+'　｜　'+person.name;
 pdfCleanup();stage.replaceChildren();
 viewer.hidden=false;home.setAttribute('aria-hidden','true');document.body.style.overflow='hidden';document.getElementById('back').focus();
 if(video){
  const el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.preload='metadata';el.src=src;
  el.setAttribute('aria-label',person.name+'さんの動画');stage.append(el);el.play().catch(()=>{});
 }else{
  showPdf(src,person.name);
 }
}
async function showPdf(src,personName){
 const session=pdfSession;
 const wrap=document.createElement('div');wrap.className='pdf-ui';
 const bar=document.createElement('nav');bar.className='pdf-controls';bar.setAttribute('aria-label','PDFページ操作');
 const prev=document.createElement('button');prev.className='pdf-btn';prev.textContent='◀ 前のページ';prev.disabled=true;
 const count=document.createElement('span');count.className='pdf-count';count.textContent='— / —';
 const next=document.createElement('button');next.className='pdf-btn';next.textContent='次のページ ▶';next.disabled=true;
 const fit=document.createElement('button');fit.className='pdf-btn';fit.textContent='画面に合わせる';
 bar.append(prev,count,next,fit);
 const work=document.createElement('div');work.className='pdf-work';
 const message=document.createElement('div');message.className='pdf-message';message.setAttribute('role','status');
 const spinner=document.createElement('div');spinner.className='pdf-spinner';spinner.setAttribute('aria-hidden','true');
 const status=document.createElement('div');status.textContent='作品を読み込んでいます…';message.append(spinner,status);
 work.append(message);wrap.append(bar,work);stage.append(wrap);
 const error=(detail)=>{
  if(session!==pdfSession)return;
  work.replaceChildren();const box=document.createElement('div');box.className='pdf-message';
  const t=document.createElement('div');t.className='pdf-error';t.textContent='PDFを表示できませんでした。'+detail;
  const a=document.createElement('a');a.href=src;a.target='_blank';a.rel='noopener';a.textContent='PDFを直接開く（Edge標準表示）';
  box.append(t,a);work.append(box);
 };
 if(!window.pdfjsLib){error('学校のネットワークでPDF表示ライブラリを取得できない可能性があります。');return;}
 const lib=window.pdfjsLib;
 lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 let pdf=null,pageNum=1,rendering=false,pending=false;
 const update=()=>{count.textContent=pageNum+' / '+(pdf?.numPages||'—');prev.disabled=!pdf||pageNum<=1;next.disabled=!pdf||pageNum>=pdf.numPages;};
 async function draw(){
  if(!pdf||session!==pdfSession)return;
  if(rendering){pending=true;return}
  rendering=true;update();
  work.replaceChildren(message);status.textContent='ページを表示しています…';
  try{
   const page=await pdf.getPage(pageNum);
   if(session!==pdfSession)return;
   const base=page.getViewport({scale:1});
   const usableW=Math.max(200,work.clientWidth-36),usableH=Math.max(200,work.clientHeight-36);
   const scale=Math.min(usableW/base.width,usableH/base.height,2.2);
   const viewport=page.getViewport({scale:scale});
   const pixelRatio=Math.min(window.devicePixelRatio||1,2);
   const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});
   canvas.width=Math.ceil(viewport.width*pixelRatio);canvas.height=Math.ceil(viewport.height*pixelRatio);
   canvas.style.width=Math.round(viewport.width)+'px';canvas.style.height=Math.round(viewport.height)+'px';
   const paper=document.createElement('div');paper.className='pdf-paper';paper.append(canvas);
   pdfRenderTask=page.render({canvasContext:ctx,viewport,transform:pixelRatio!==1?[pixelRatio,0,0,pixelRatio,0,0]:null});
   await pdfRenderTask.promise;
   if(session!==pdfSession)return;
   work.replaceChildren(paper);
  }catch(e){if(e?.name!=='RenderingCancelledException')error('ページの描画に失敗しました。');}
  finally{rendering=false;pdfRenderTask=null;if(pending&&session===pdfSession){pending=false;draw();}}
 }
 const turn=(n)=>{if(!pdf||rendering)return;pageNum=Math.max(1,Math.min(pdf.numPages,pageNum+n));draw()};
 prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));fit.addEventListener('click',()=>{if(pdf&&!rendering)draw()});
 // ホイールで1ページずつ移動。タッチパッドの慣性・連続イベントはまとめて扱う。
 // ボタン操作は従来どおり。ページ描画中の連続移動は受け付けない。
 let wheelSum=0,lastWheelAt=0,lastTurnAt=0,lastWheelDirection=0;
 wrap.addEventListener('wheel',e=>{
  if(session!==pdfSession||!pdf)return;
  // Ctrl+ホイールはブラウザの拡大縮小操作として残す。
  if(e.ctrlKey||e.metaKey)return;
  e.preventDefault();
  const now=performance.now();
  // 機種依存の行・ページ単位をピクセル相当に換算。
  const amount=e.deltaY*(e.deltaMode===1?18:e.deltaMode===2?360:1);
  if(Math.abs(amount)<.1)return;
  const direction=Math.sign(amount);
  if(now-lastWheelAt>260||lastWheelDirection!==direction)wheelSum=0;
  lastWheelAt=now;lastWheelDirection=direction;
  if(rendering||now-lastTurnAt<680){wheelSum=0;return;}
  wheelSum+=amount;
  if(Math.abs(wheelSum)<55)return;
  wheelSum=0;
  const target=Math.max(1,Math.min(pdf.numPages,pageNum+direction));
  if(target!==pageNum){lastTurnAt=now;turn(direction);}
 },{passive:false});
 try{
  pdfTask=lib.getDocument({url:src,disableAutoFetch:false});
  pdfTask.onProgress=(p)=>{if(session===pdfSession&&p.total){status.textContent='作品を読み込んでいます… '+Math.min(99,Math.round(p.loaded/p.total*100))+'%';}};
  pdf=await pdfTask.promise;
  if(session!==pdfSession)return;
  await draw();
 }catch(e){error('ファイルが見つからないか、読み込みに失敗しました。');}
}
function close(){
 if(viewer.hidden)return;
 pdfCleanup();stage.querySelector('video')?.pause();stage.replaceChildren();viewer.hidden=true;
 home.removeAttribute('aria-hidden');document.body.style.overflow='';opener?.focus();
}
document.getElementById('back').addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>
